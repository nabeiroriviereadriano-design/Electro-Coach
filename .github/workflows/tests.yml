name: Tests du noyau

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Noyau (moteur d'exercices, couverture, contenu)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: packages/coach_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Analyse statique
        run: dart analyze 2>&1 | tee analyze.log
      - name: Tests
        run: dart test --reporter expanded --no-color 2>&1 | tee test.log
      - name: Vérification du contenu et couverture du programme
        if: always()
        run: dart run bin/validate.dart 2>&1 | tee validate.log
      - name: Résumé
        if: always()
        run: |
          {
            echo '### Analyse'; echo '```'; tail -n 40 analyze.log 2>/dev/null; echo '```'
            echo '### Tests'; echo '```'; (grep -E "\[E\]|Some tests failed|All tests passed|Expected|Actual|Which|ERREUR" test.log 2>/dev/null || true) | tail -n 80; echo '```'
            echo '### Contenu'; echo '```'; cat validate.log 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-logs
          path: packages/coach_core/*.log
