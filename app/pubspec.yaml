name: electro_coach
description: BTS Électro Coach — maths et sciences appliquées du BTS Électrotechnique.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  coach_core:
    path: ../packages/coach_core
  flutter_math_fork: ^0.7.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/content/
    - assets/content/packs/
  fonts:
    - family: Doto
      fonts:
        - asset: assets/fonts/Doto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Doto-Black.ttf
          weight: 900
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Inter-SemiBoldItalic.ttf
          weight: 600
          style: italic
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    # symboles mathématiques absents d'Inter (∠…) : police de secours
    - family: DejaVuMath
      fonts:
        - asset: assets/fonts/DejaVuSans-Math.ttf

flutter_launcher_icons:
  android: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#080808"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  min_sdk_android: 24
  windows:
    generate: true
    image_path: assets/branding/app_icon.png
    icon_size: 256
